plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// CI passes -PversionCode=<run number> so each build is "newer" than the last;
// the in-app updater compares this against the published latest. Resolved here
// (not inline in defaultConfig) to avoid Groovy command-chain ambiguity.
def tarsVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def tarsVersionName = (project.findProperty('versionName') ?: 'dev').toString()

android {
    namespace 'com.tars.app'
    compileSdk 33

    defaultConfig {
        applicationId 'com.tars.app'
        minSdk 26            // Android 8.0 — the local llama.cpp model needs a
                             // capable modern device anyway (older/weaker phones
                             // can't run a model regardless).
        targetSdk 33
        versionCode tarsVersionCode
        versionName tarsVersionName

        // Your phone (and every real Android phone) is arm64. x86_64 only matters
        // for PC emulators — and the llama.cpp engine is cross-compiled for arm64
        // only anyway, so the x86_64 copy was dead weight that just bloated every
        // download. arm64-only roughly cuts the native payload by a third.
        ndk {
            abiFilters 'arm64-v8a'
        }

        python {
            version '3.11'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    // A fixed keystore committed to the repo so EVERY build (here and in CI) is
    // signed with the same key. Without this, each CI run signs with a fresh
    // ephemeral debug key, and Android refuses to update across mismatched
    // signatures ("conflicts with another package"). It's a debug-grade key —
    // fine to be public for a self-distributed app.
    signingConfigs {
        tars {
            storeFile file('tars.keystore')
            storePassword 'tarspass'
            keyAlias 'tars'
            keyPassword 'tarspass'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tars
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tars
        }
    }

    packagingOptions {
        // The llama.cpp server ships as an executable disguised as a .so; keep
        // it uncompressed/extracted so it can be run, and don't strip it.
        jniLibs {
            useLegacyPackaging true
        }
        doNotStrip '**/libllamaserver.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Official sherpa-onnx AAR (offline Piper TTS + speech recognition). CI
    // downloads it into app/libs; resolved via the flatDir repo in settings.gradle.
    implementation(name: 'sherpa-onnx', ext: 'aar')
    // CameraX — TARS's eyes (still frames fed to the multimodal model).
    // 1.2.3 is the last line that builds against compileSdk 33 (1.3+ wants 34).
    def camerax = '1.2.3'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
}

// Make the repo-root `tars` package available to Chaquopy via the default
// src/main/python source dir. We copy it (rather than point Chaquopy's srcDir at
// the repo root) because the repo root contains this module's build/ output —
// scanning that would recurse infinitely (Chaquopy copies into build/python and
// then re-scans it). The copy runs at configuration time, before Chaquopy's
// mergeDebugPythonSources task, so the sources are always present.
copy {
    from "${rootProject.projectDir}/../tars"
    into "${projectDir}/src/main/python/tars"
}
