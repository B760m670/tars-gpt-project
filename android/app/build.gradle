plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI passes -PversionCode=<run number> so each build is "newer" than the last.
def tarsVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def tarsVersionName = (project.findProperty('versionName') ?: 'dev').toString()

android {
    namespace 'com.tars.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tars.app'
        minSdk 30
        versionCode tarsVersionCode
        versionName tarsVersionName
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Fixed debug keystore committed to the repo so every build (here and in CI)
    // is signed with the same key — required for in-place app updates.
    signingConfigs {
        tars {
            storeFile file('tars.keystore')
            storePassword 'tarspass'
            keyAlias 'tars'
            keyPassword 'tarspass'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tars
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tars
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    // Cloud brain: a pool of free OpenAI-compatible providers, called over HTTP.
    // (org.json for request/response bodies is built into the Android platform.)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
