plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.tars.app'
    compileSdk 33

    defaultConfig {
        applicationId 'com.tars.app'
        minSdk 21            // Android 5.0 (Lollipop)
        targetSdk 33
        // CI passes -PversionCode=<run number> so each build is "newer" than the
        // last; the in-app updater compares this against the published latest.
        versionCode (project.findProperty('versionCode') ?: '1').toString().toInteger()
        versionName (project.findProperty('versionName') ?: 'dev').toString()

        // Chaquopy ships a native CPython per ABI; cover phones old and new.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        python {
            version '3.11'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// Make the repo-root `tars` package available to Chaquopy via the default
// src/main/python source dir. We copy it (rather than point Chaquopy's srcDir at
// the repo root) because the repo root contains this module's build/ output —
// scanning that would recurse infinitely (Chaquopy copies into build/python and
// then re-scans it). The copy runs at configuration time, before Chaquopy's
// mergeDebugPythonSources task, so the sources are always present.
copy {
    from "${rootProject.projectDir}/../tars"
    into "${projectDir}/src/main/python/tars"
}
