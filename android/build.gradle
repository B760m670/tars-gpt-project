// Top-level build file. Modern toolchain (AGP 8 / Gradle 8 / Kotlin 1.9) — the
// old Chaquopy-imposed pin to AGP 7.4 is gone now that the brain is native Kotlin
// + in-process llama.cpp (no embedded Python).
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
