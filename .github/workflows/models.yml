name: Mirror models to release

# Hosts the on-device GGUF models on THIS repo's "models" release, so the phone
# downloads them from GitHub (reliable) instead of HuggingFace (whose redirect/
# CDN caused the "download interrupted (0 MB)" failures on-device). HuggingFace IS
# reachable from GitHub runners, so we mirror here, once, on demand.
#
# Run manually (once it's on the default branch): Actions → "Mirror models to
# release" → Run workflow. Until then, it also runs whenever THIS file is pushed
# (so it can be triggered from a feature branch — workflow_dispatch only shows on
# the default branch).
#
# NOTE: GitHub release assets are capped at 2 GB/file, so only the 0.6B and 1.7B
# GGUFs are mirrored here (the 1.7B is the pick for a 6 GB phone). The 4B (~2.5 GB)
# needs a different host and is left out for now.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/models.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model:
          - repo: Qwen/Qwen3-0.6B-GGUF
            file: Qwen3-0.6B-Q4_K_M.gguf
          - repo: Qwen/Qwen3-1.7B-GGUF
            file: Qwen3-1.7B-Q4_K_M.gguf
          - repo: Vikhrmodels/Vikhr-Qwen-2.5-1.5B-Instruct-GGUF
            file: vikhr-qwen2.5-1.5b-Q4_K_M.gguf
    steps:
      - name: Resolve real filename on HuggingFace and download
        run: |
          set -euo pipefail
          repo="${{ matrix.model.repo }}"
          canonical="${{ matrix.model.file }}"
          echo "querying HuggingFace API for $repo"
          curl -fsSL "https://huggingface.co/api/models/$repo" -o model.json
          # The GGUF filename/casing varies (lowercase, or a subfolder), so discover
          # the actual Q4_K_M *.gguf instead of guessing (a wrong guess was the
          # original 404). Prefer a single-file Q4_K_M, then any Q4_K_M, then any gguf.
          fname="$(jq -r '[.siblings[].rfilename | select(endswith(".gguf"))] as $g | ([ $g[] | select(test("q4_k_m";"i")) | select(test("-of-";"i")|not) ] + [ $g[] | select(test("q4_k_m";"i")) ] + $g)[0] // ""' model.json)"
          echo "resolved: '$fname'"
          test -n "$fname"
          curl -fL --retry 5 --retry-delay 5 \
            -o "$canonical" \
            "https://huggingface.co/$repo/resolve/main/$fname?download=true"
          ls -lh "$canonical"

      - name: Upload to the "models" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models
          name: TARS on-device models
          prerelease: true
          files: ${{ matrix.model.file }}
