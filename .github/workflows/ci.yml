name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Core smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor the core promises (stripped-down Android Python);
        # 3.12 guards against the future. No pip installs — stdlib only.
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile the package (syntax check)
        run: python -m compileall -q tars
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
