name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK (Chaquopy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy uses a host Python at build time (buildPython); match the
      # target version (3.11) so bundled bytecode lines up.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      # Build the llama.cpp server for Android (arm64-v8a) and package it as a
      # native lib, so TARS can run a local GGUF model fully on-device. It's
      # shipped as lib*.so because Android only executes binaries from the
      # (executable) native lib dir, not from app storage.
      - name: Install NDK & CMake
        run: yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null

      - name: Build llama.cpp server (arm64-v8a)
        run: |
          set -e
          # Pin to b5012: a real, Android-friendly tag (b5000 isn't a tag), before
          # multimodal (mtmd) and the Svelte web UI were pulled into the server —
          # those don't cross-compile cleanly with the NDK and TARS doesn't need them.
          git clone --depth 1 --branch b5012 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON
          # Build only the server target (-j2: modest memory, faster than -j1).
          # The binary is named llama-server (older trees: server).
          cmake --build /tmp/llama-build --target llama-server -j2 \
            || cmake --build /tmp/llama-build --target server -j2
          BIN="$(find /tmp/llama-build -type f \( -name llama-server -o -name server \) | head -n1)"
          echo "built server: $BIN"
          test -n "$BIN"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$BIN" android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so

      - name: Build debug APK
        # versionCode = run number so every build is "newer"; the in-app updater
        # compares against this.
        run: |
          gradle -p android assembleDebug --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=b${{ github.run_number }}

      - name: Write version marker
        run: echo "${{ github.run_number }}" > version.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tars-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish a rolling pre-release so the APK + version marker are one click to
      # download AND so the in-app self-updater can find the latest build. Runs on
      # main and on the active dev branch (so updates work while testing it).
      - name: Publish APK to the rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/import-tars-folder-m8wylg'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TARS (latest build)
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            version.txt
