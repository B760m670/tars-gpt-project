name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned llama.cpp release — reproducible builds (no more "latest tag breaks
  # the flags on its own"). Bump deliberately, never implicitly.
  LLAMA_TAG: b9733
  NDK_VERSION: 26.3.11579264
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" >/dev/null

      # The on-device engine: llama.cpp is compiled from source by the app's
      # CMake (externalNativeBuild). We clone the PINNED tag next to the JNI code;
      # it's gitignored, never committed.
      - name: Fetch llama.cpp (pinned ${{ env.LLAMA_TAG }})
        run: |
          set -e
          git clone --depth 1 --branch "$LLAMA_TAG" \
            https://github.com/ggml-org/llama.cpp \
            android/app/src/main/cpp/llama.cpp
          echo "llama.cpp at: $(git -C android/app/src/main/cpp/llama.cpp describe --tags --always)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle -p android assembleDebug --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=b${{ github.run_number }}

      - name: Write version marker
        run: echo "${{ github.run_number }}" > version.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tars-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/import-tars-folder-m8wylg' || github.ref == 'refs/heads/claude/russian-greeting-nesa0h'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TARS (latest build)
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            version.txt
