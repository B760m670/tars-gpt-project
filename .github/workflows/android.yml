name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle -p android assembleDebug --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=b${{ github.run_number }}

      - name: Write version marker
        run: echo "${{ github.run_number }}" > version.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tars-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/russian-greeting-nesa0h'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TARS (latest build)
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            version.txt
